# mango (mangowm) — startups: hand-edited user autostart
#
# exec-once runs once at mango start; exec runs on every config reload.
# (nix-injected autostart lives in nix-startups.conf — don't edit that one.)
#
# systemd session integration (niri does this via its user unit; mango is not
# systemd-launched, so we pull the standard session target in ourselves via
# mango-session.target — shipped by sysjar/WM-mango, since systemd refuses
# manual starts of graphical-session.target).
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=dbus-update-activation-environment --all
exec-once=systemctl --user start mango-session.target

# X server compatibility (same as niri spawns xwayland-satellite)
exec-once=xwayland-satellite

# GNOME keyring (unlocks secrets without a display manager)
exec-once=gnome-keyring-daemon --start --components=secrets

# Input method (fcitx5) — needed for the Super+space Japanese toggle
exec-once=fcitx5 -d

# Clipboard history store (jclip / cliphist)
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# Wallpaper daemon + setter (awww backend)
exec-once=awww-daemon
exec-once=bash -c "sleep 1 && random-wall"