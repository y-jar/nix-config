# mango (mangowm) binds: key / mouse / axis bindings + layer rules
# Key names refer to `xev` / `wev` output.
# Mod keys: super, ctrl, alt, shift, none
# Syntax: bind[flags]=MOD,KEY,COMMAND,PARAM
# Keymodes: `keymode=<name>` scopes following binds; `setkeymode` switches.
# NOTE: SUPER+space is intentionally left UNBOUND so fcitx5/mozc keeps its
# global Super+space input-method toggle.

# ===========================APP (niri-style, SUPER = Mod)
bind=SUPER,Return,spawn,foot                                     # terminal
bind=SUPER+SHIFT,D,spawn,fuzzel                                  # launcher
bind=SUPER,D,spawn_shell,shjctl toggleLauncher $(mmsg get cursorpos | jq -r .monitor)   # shelljar launcher at cursor monitor
bind=SUPER,B,spawn,librewolf                                     # browser
bind=SUPER+SHIFT,B,spawn,jsearch                                 # browser search
bind=SUPER,E,spawn,nautilus                                      # file explorer
bind=SUPER,A,spawn,bazaar                                        # app store
bind=SUPER,G,spawn,g4music                                       # gapless music
bind=SUPER,C,spawn,hyprpicker -a                                 # color picker
bind=SUPER,P,spawn_shell,shjctl toggleSession $(mmsg get cursorpos | jq -r .monitor)         # shelljar power menu
bind=SUPER,W,spawn_shell,shjctl wallpaperNext $(mmsg get cursorpos | jq -r .monitor)          # shelljar wallpaper next
bind=SUPER,O,spawn_shell,shjctl wallpaperPrev $(mmsg get cursorpos | jq -r .monitor)          # shelljar wallpaper prev
bind=SUPER+CTRL,W,spawn,waypaper                                 # wallpaper gui
bind=SUPER,S,spawn_shell,shjctl toggleControlCenter $(mmsg get cursorpos | jq -r .monitor)    # shelljar control center
bind=SUPER+ALT,L,spawn,swaylock                                  # lock screen

# ===========================SCREENSHOTS (jshot: grim+slurp+swappy)
bind=SUPER+SHIFT,S,spawn,jshot region
bind=SUPER+CTRL+SHIFT,S,spawn,jshot screen
bind=SUPER+ALT,S,spawn,jshot window

# ===========================CORE
bind=SUPER,r,reload_config
bind=SUPER,M,quit
bind=SUPER,Q,killclient,

# ===========================OVERVIEW
bind=SUPER,Tab,toggleoverview
bind=Alt,Tab,switcher,all_next

# ===========================HELP
bind=SUPER+SHIFT,Slash,spawn,jbinds         # keybind cheat sheet ("?")

# ===========================HIDDEN TAG (special overlay)
# SUPER+Period is taken by scroller_stack,right, so the hide/peek pair uses Shift/Ctrl.
bind=SUPER+SHIFT,Period,tag_special_silent, # hide focused window (<-> send it back)
bind=SUPER+CTRL,Period,toggle_special_tag   # peek: show/hide the hidden layer

# ===========================LAYOUT (switch + scroller)
bind=SUPER,n,switch_layout                             # cycle circle_layout: scroller,tile,fair,deck,vertical_tile
bind=SUPER,Slash,setlayout,scroller
bind=SUPER+ALT,T,setlayout,tile
bind=SUPER+ALT,F,setlayout,fair
bind=SUPER+ALT,D,setlayout,deck
bind=SUPER+ALT,V,setlayout,vertical_tile
bind=SUPER,Comma,scroller_stack,left
bind=SUPER,Period,scroller_stack,right
bind=SUPER+CTRL,r,set_proportion,0.5
bind=SUPER+SHIFT,r,switch_proportion_preset
bind=SUPER+CTRL,Slash,spawn,jlayout              # toggle scroller <-> vertical_scroller

# ===========================FOCUS (vim + arrows)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# swap window
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# switch window status
bind=SUPER+CTRL,G,toggleglobal,
bind=SUPER+ALT,Tab,togglejump,
bind=SUPER,V,togglefloating,
bind=SUPER+SHIFT,V,spawn,jclip # clipboard history menu
bind=SUPER,F,togglemaximizescreen,
bind=SUPER+SHIFT,F,togglefullscreen,
bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,Z,toggle_scratchpad

# ===========================TAGS
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# tag switch (prev/next)
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0

# ===========================MONITOR
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# ===========================GAPS
bind=SUPER+CTRL,Minus,incgaps,-1
bind=SUPER+CTRL,Equal,incgaps,1
bind=SUPER+SHIFT,G,togglegaps

# ===========================RESIZE (niri-style: Mod+-/= width, Shift+-/= height; persists via scroller proportions)
bind=SUPER,Minus,resizewin,-200,+0
bind=SUPER,Equal,resizewin,+200,+0
bind=SUPER+SHIFT,Minus,resizewin,+0,-200
bind=SUPER+SHIFT,Equal,resizewin,+0,+200

# resize window (fine, pixel steps)
bind=SUPER+CTRL+SHIFT,Up,resizewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,resizewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,resizewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,resizewin,+50,+0

# ===========================MEDIA KEYS
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# ===========================MOUSE
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ===========================AXIS
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# ===========================GESTURES (touchpad)
# 3 fingers = move focus; 4 fingers = tag switch / overview.
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft
gesturebind=none,right,4,viewtoright
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# ===========================LAYER RULES
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
