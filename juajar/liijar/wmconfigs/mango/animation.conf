# mango (mangowm) — animation: snappy open/close/focus/tag transitions.
# Curves follow the Hakuspace animation.conf (ease-out cubic), tag switch vertical.

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.5
zoom_end_ratio=0.8
fadein_begin_opacity=1
fadeout_begin_opacity=1
animation_duration_move=600
animation_duration_open=600
animation_duration_tag=700
animation_duration_close=500
animation_duration_focus=700
animation_curve_open=0.1,0.8,0.24,1
animation_curve_move=0.1,0.8,0.24,1
animation_curve_tag=0.1,0.8,0.24,1
animation_curve_close=0.1,0.8,0.24,1
animation_curve_focus=0.1,0.8,0.24,1
animation_curve_opafadeout=0.1,0.8,0.24,1
animation_curve_opafadein=0.1,0.8,0.24,1