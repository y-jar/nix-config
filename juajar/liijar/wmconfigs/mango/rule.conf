# mango (mangowm) — rules: window rules (migrated from niri rules.kdl)
# NOTE: shield_when_capture blacks the window ON-SCREEN too while any capture is
# active (mango paints a black rect over the client; not capture-only like niri).
# So it is NOT applied to keepass etc. — use the hidden tag (SUPER+SHIFT+Period)
# to tuck windows away while streaming instead.

# keybind cheat sheet (SUPER+SHIFT+Slash) — floating, centered terminal overlay
windowrule=isfloating:1,width:0.9,height:0.8,offsetx:0,offsety:0,appid:^jbinds$

# swipe up on touchpad opens overview (niri hot-corner equivalent)
# (hotarea handled in input.conf)