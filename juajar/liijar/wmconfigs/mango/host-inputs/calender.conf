# mango host-specific inputs — calender
# Mirrors niri's calender layout (host-inputs/calender.kdl):
#   DP-3      2560x1440  @ (0,0)      main center
#   HDMI-A-1  1920x1080  @ (2560,10)  side right
#   DP-2      1920x1080  @ (0,1440)  scale 1.25  bottom

# ===========================MONITORS
monitorrule=name:^DP-3$,width:2560,height:1440,x:0,y:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,x:2560,y:10
monitorrule=name:^DP-2$,width:1920,height:1080,x:0,y:1440,scale:1.25

# ===========================INPUT
# trackpad / mouse (need relogin to apply)
tap_to_click=1
trackpad_natural_scrolling=0
mouse_natural_scrolling=0

# keyboard layout
xkb_rules_layout=us