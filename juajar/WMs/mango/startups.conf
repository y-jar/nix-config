# mango (mangowm) startups: hand-edited user autostart
#
# exec_once runs once at mango start; exec runs on every config reload.
# (nix-injected autostart lives in nix-startups.conf don't edit that one.)
#
# systemd session integration (niri does this via its user unit; mango is not
# systemd-launched, so we pull the standard session target in ourselves via
# mango-session.target shipped by WMs/mango/system.nix, since systemd refuses
# manual starts of graphical-session.target).
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=dbus-update-activation-environment --all
exec_once=systemctl --user start mango-session.target

# X server compatibility (same as niri spawns xwayland-satellite)
exec_once=xwayland-satellite

# GNOME keyring (unlocks secrets without a display manager)
exec_once=gnome-keyring-daemon --start --components=secrets

# Input method (fcitx5) needed for the Super+space Japanese toggle
exec_once=fcitx5 -d

# Clipboard history store (jclip / cliphist)
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store

# Wallpaper daemon + setter (awww backend)
exec_once=awww-daemon
exec_once=sleep 1 && random-wall
