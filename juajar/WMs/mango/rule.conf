# mango (mangowm) rules: window rules (migrated from niri rules.kdl)
# NOTE: shield_when_capture blacks the window ON-SCREEN too while any capture is
# active (mango paints a black rect over the client; not capture-only like niri).
# So it is NOT applied to keepass etc. use the hidden tag (SUPER+SHIFT+Period)
# to tuck windows away while streaming instead.

# keybind cheat sheet (SUPER+SHIFT+Slash) floating, centered terminal overlay
window_rule=is_floating:1,width:0.9,height:0.8,offset_x:0,offset_y:0,app_id:^jbinds$

# zoom lens (SUPER+Z): woomer captures a screenshot at spawn and fullscreens
# itself over the captured monitor; mango ignores client fullscreen requests
# (ignore_maximize default), so force it open fullscreen to keep capture+window
# aligned (title set via raylib CARGO_BIN_NAME).
window_rule=is_fullscreen:1,no_border:1,no_shadow:1,no_radius:1,app_id:^woomer$
window_rule=is_fullscreen:1,no_border:1,no_shadow:1,no_radius:1,title:^woomer$

# swipe up on touchpad opens overview (niri hot-corner equivalent)
