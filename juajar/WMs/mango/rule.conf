# mango (mangowm) rules: window rules (migrated from niri rules.kdl)
# shield_when_capture = stream privacy patch (juajar/WMs/mango/patches):
# shielded windows stay fully visible and clickable but read as opaque
# black inside screen shares (PipeWire/ext-image-copy-capture). Toggle on
# the focused window with SUPER+CTRL+SHIFT+G. Old note for reference:
# stock mango's shield painted the black rect on-screen as well, so
# shield rules are only worth it for windows you always want protected
# (typical candidates: keepass/password managers during demos).
window_rule=app_id:^org.keepassxc.KeePassXC$,shield_when_capture:1
# window_rule=app_id:^discord-stable-x86_64$,shield_when_capture:1

# keybind cheat sheet (SUPER+SHIFT+Slash) floating, centered terminal overlay
window_rule=is_floating:1,width:0.9,height:0.8,offset_x:0,offset_y:0,app_id:^jbinds$

# swipe up on touchpad opens overview (niri hot-corner equivalent)
# (hotarea handled in input.conf)
