# mango host-specific inputs (0-unknown base)
# Filled per host for monitors/input tweaks. Copy this file to <host>.conf
# in this folder, then edit. See niri's host-inputs for the same pattern.
# Find output names: mango IPC / inspect on first launch.
# Monitors:
# DEFINE m "eDP-1", 2880x1800@144
# Layout: DEFINE L "eDP-1", 0, 0, 1 (x, y, scale)
#
# Trackpad / mouse (need relogin to apply):
# tap_to_click=1
# trackpad_natural_scrolling=0
# mouse_natural_scrolling=0
#
# Keyboard layout (per ppm):
# xkb_rules_layout=us