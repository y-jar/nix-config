# mango (mangowm) input: overview + misc + keyboard/trackpad/mouse
# Overview Setting
hotarea_size=10
enable_hotarea=1
hotarea_corner=0
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
# Paces axis binds (ms between accepted dispatches): 150 merges the whole
# same-notch burst of smooth scrolling wheels into exactly one zoom step.
axis_bind_apply_timeout=150
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
