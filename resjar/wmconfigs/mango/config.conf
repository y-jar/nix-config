# mango (mangowm) user config
# Category linker: sources each config section + generated + per-host overrides.
# Source order matters — later files override duplicate keys.
# Validate: mango -c ~/.config/mango/config.conf -p
# More options: https://mangowm.github.io/docs
#
source=~/.config/mango/env.conf
source=~/.config/mango/looks.conf
source=~/.config/mango/animation.conf
source=~/.config/mango/layouts.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rule.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/startups.conf
source=~/.config/mango/nix-startups.conf
source=~/.config/mango/host-inputs.conf