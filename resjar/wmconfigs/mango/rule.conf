# mango (mangowm) — rules: window rules (migrated from niri rules.kdl)
# shield_when_capture keeps apps blacked-out from screen capture (niri's
# block-out-from "screen-capture").

# privacy / password managers — hide from screen recording/capture
windowrule=shield_when_capture:1,appid:^org\.keepassxc\.KeePassXC$
windowrule=shield_when_capture:1,appid:^org\.gnome\.World\.Secrets$
windowrule=shield_when_capture:1,appid:^org\.gnome\.PasswordSafe$

# swipe up on touchpad opens overview (niri hot-corner equivalent)
# (hotarea handled in input.conf)

# ===========================SCROLLER PROPORTIONS
# Full-width content apps (browsers / editors) for the scroll-right scroller.
windowrule=scroller_proportion:1.0,appid:librewolf
windowrule=scroller_proportion:1.0,appid:firefox
windowrule=scroller_proportion:1.0,appid:zen
windowrule=scroller_proportion:1.0,appid:app.zen_browser.zen
windowrule=scroller_proportion:1.0,appid:code
windowrule=scroller_proportion:1.0,appid:zed
windowrule=scroller_proportion:1.0,appid:obsidian

# Narrower utility / chat windows
windowrule=scroller_proportion:0.7,appid:discord
windowrule=scroller_proportion:0.65,appid:org.gnome.Nautilus